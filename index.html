<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Backtest, optimize, and validate single-stock trading strategies with a deterministic simulation and optional AI review."
    />
    <meta name="theme-color" content="#0f172a" />
    <title>AI Trading Strategy Analyzer</title>
    <script>
      // Apply the stored theme before first paint so dark mode does not flash.
      try {
        const stored = localStorage.getItem('theme');
        const dark = stored !== 'light';
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0f172a' : '#f1f5f9');
      } catch {
        /* Keep the default dark theme when storage is unavailable. */
      }
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
